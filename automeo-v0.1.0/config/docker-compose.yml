version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: abs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-abs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-abs_pass}
      POSTGRES_DB: ${DB_NAME:-auto_business}
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-abs_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: abs-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: abs-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-abs_user}:${DB_PASSWORD:-abs_pass}@postgres:5432/${DB_NAME:-auto_business}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/deliveries:/app/data/deliveries
      - ./data/workspace:/app/data/workspace

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: abs-web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
